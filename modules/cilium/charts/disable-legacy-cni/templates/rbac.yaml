apiVersion: v1
kind: ServiceAccount
metadata:
  name: disable-legacy-cni
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "disable-legacy-cni.hookAnnotations" . | nindent 4 }}
    helm.sh/hook-weight: "-20"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: disable-legacy-cni
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "disable-legacy-cni.hookAnnotations" . | nindent 4 }}
    helm.sh/hook-weight: "-20"
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["aws-node", "kube-proxy"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: disable-legacy-cni
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "disable-legacy-cni.hookAnnotations" . | nindent 4 }}
    helm.sh/hook-weight: "-20"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: disable-legacy-cni
subjects:
  - kind: ServiceAccount
    name: disable-legacy-cni
    namespace: {{ .Release.Namespace }}
