apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  instanceProfile: {{ .Values.instanceProfile | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}
  # Private /19s only: bootstrap tags internal-elb on those subnets, not
  # on public /26s or control-plane /28s. Cluster module adds cluster=shared.
  subnetSelectorTerms:
    - tags:
        kubernetes.io/role/internal-elb: "1"
        kubernetes.io/cluster/{{ .Values.clusterName }}: "shared"
  securityGroupSelectorTerms:
    - id: {{ .Values.clusterSecurityGroupId | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
